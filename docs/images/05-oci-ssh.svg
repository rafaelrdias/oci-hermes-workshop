<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">Configure variables — SSH opcional</title><desc id="desc">Tela ilustrativa. Dados fictícios. Para gerar SSH: aceite da chave privada + pública manual vazia. Para conectar: informe um CIDR. CIDR vazio deixa a porta fechada. 0.0.0.0/0 exige aceite próprio e não se fecha sozinho.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="0" y="0" width="1200" height="790" rx="0" fill="#f8faf8" stroke="none"/><rect x="0" y="0" width="1200" height="60" rx="0" fill="#263331" stroke="none"/><text x="28" y="39" font-size="24" fill="#fff" font-weight="700">ORACLE</text><text x="175" y="38" font-size="18" fill="#fff" font-weight="400">Cloud Infrastructure</text><text x="778" y="37" font-size="16" fill="#d7e3dd" font-weight="400">⌕  Pesquisar recursos</text><rect x="26" y="88" width="181" height="594" rx="8" fill="#f1f4f2" stroke="none"/><text x="42" y="122" font-size="17" fill="#2c4942" font-weight="700">Resource Manager</text><text x="42" y="171" font-size="16" fill="#233336" font-weight="400">Visão geral</text><text x="42" y="249" font-size="16" fill="#233336" font-weight="400">Jobs</text><text x="42" y="286" font-size="16" fill="#233336" font-weight="400">Configurações</text><rect x="31" y="187" width="170" height="37" rx="8" fill="#dceae4" stroke="none"/><text x="43" y="212" font-size="16" fill="#245d4d" font-weight="700">Stacks</text><text x="245" y="99" font-size="15" fill="#61736c" font-weight="400">Console OCI  /  Resource Manager</text><text x="245" y="155" font-size="27" fill="#203d35" font-weight="700">Configure variables — SSH opcional</text><rect x="244" y="188" width="924" height="494" rx="8" fill="#fff" stroke="#d3ded8"/><rect x="914" y="78" width="254" height="28" rx="8" fill="#fcf0d5" stroke="none"/><text x="927" y="97" font-size="11" fill="#715014" font-weight="700">TELA ILUSTRATIVA • NÃO É CAPTURA</text><rect x="271" y="215" width="22" height="22" rx="3" fill="#286f60" stroke="#8aaba2"/><text x="275" y="232" font-size="18" fill="#fff" font-weight="700">✓</text><text x="305" y="233" font-size="17" fill="#233336" font-weight="400">Gerar chave SSH automaticamente para esta Stack</text><rect x="271" y="262" width="22" height="22" rx="3" fill="#286f60" stroke="#8aaba2"/><text x="275" y="279" font-size="18" fill="#fff" font-weight="700">✓</text><text x="305" y="280" font-size="17" fill="#233336" font-weight="400">Aceito armazenar a chave SSH privada no state da Stack</text><text x="271" y="332" font-size="16" fill="#475854" font-weight="600">Chave pública SSH opcional</text><rect x="271" y="344" width="863" height="43" rx="5" fill="#fff" stroke="#bcc9c6"/><text x="285" y="371" font-size="18" fill="#233336" font-weight="400">Deixe vazio quando gerar automaticamente</text><text x="271" y="424" font-size="16" fill="#475854" font-weight="600">Origem IPv4 do SSH</text><rect x="271" y="436" width="863" height="43" rx="5" fill="#fff" stroke="#147c6c"/><text x="285" y="463" font-size="18" fill="#233336" font-weight="400">203.0.113.10/32  ← exemplo; use seu IPv4 público</text><rect x="271" y="509" width="22" height="22" rx="3" fill="#fff" stroke="#8aaba2"/><text x="275" y="526" font-size="18" fill="#fff" font-weight="700"></text><text x="305" y="527" font-size="17" fill="#233336" font-weight="400">Aceito expor a porta SSH à internet temporariamente</text><text x="274" y="565" font-size="17" fill="#233336" font-weight="400">O último aceite só é necessário para 0.0.0.0/0.</text><text x="274" y="591" font-size="17" fill="#233336" font-weight="400">Sem SSH: desmarque geração e deixe pública e CIDR vazios.</text><rect x="1000" y="620" width="134" height="42" rx="5" fill="#285d59" stroke="none"/><text x="1016" y="647" font-size="16" fill="#fff" font-weight="600">Next</text><rect x="32" y="705" width="1136" height="57" rx="8" fill="#e4efeb" stroke="none"/><rect x="44" y="716" width="34" height="34" rx="8" fill="#215f55" stroke="none"/><text x="53" y="740" font-size="17" fill="#fff" font-weight="700">05</text><text x="94" y="730" font-size="16" fill="#233336" font-weight="400">Para gerar SSH: aceite da chave privada + pública manual vazia. Para conectar: informe um CIDR.</text><text x="94" y="755" font-size="16" fill="#233336" font-weight="400">CIDR vazio deixa a porta fechada. 0.0.0.0/0 exige aceite próprio e não se fecha sozinho.</text><text x="32" y="781" font-size="12" fill="#677871" font-weight="400">Hermes Agent na OCI • guia para eventos • campos e posições podem variar na Console</text></svg>
