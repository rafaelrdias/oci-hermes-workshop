<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">Terraform actions → Destroy</title><desc id="desc">Tela ilustrativa. Dados fictícios. Destroy apaga dados da VM. Confira backups antes de continuar. Excluir a Stack sem Destroy não garante remover os recursos. Cópias locais e histórico podem reter segredos.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="0" y="0" width="1200" height="790" rx="0" fill="#f8faf8" stroke="none"/><rect x="0" y="0" width="1200" height="60" rx="0" fill="#263331" stroke="none"/><text x="28" y="39" font-size="24" fill="#fff" font-weight="700">ORACLE</text><text x="175" y="38" font-size="18" fill="#fff" font-weight="400">Cloud Infrastructure</text><text x="778" y="37" font-size="16" fill="#d7e3dd" font-weight="400">⌕  Pesquisar recursos</text><rect x="26" y="88" width="181" height="594" rx="8" fill="#f1f4f2" stroke="none"/><text x="42" y="122" font-size="17" fill="#2c4942" font-weight="700">Resource Manager</text><text x="42" y="171" font-size="16" fill="#233336" font-weight="400">Visão geral</text><text x="42" y="249" font-size="16" fill="#233336" font-weight="400">Jobs</text><text x="42" y="286" font-size="16" fill="#233336" font-weight="400">Configurações</text><rect x="31" y="187" width="170" height="37" rx="8" fill="#dceae4" stroke="none"/><text x="43" y="212" font-size="16" fill="#245d4d" font-weight="700">Stacks</text><text x="245" y="99" font-size="15" fill="#61736c" font-weight="400">Console OCI  /  Resource Manager</text><text x="245" y="155" font-size="27" fill="#203d35" font-weight="700">Terraform actions → Destroy</text><rect x="244" y="188" width="924" height="494" rx="8" fill="#fff" stroke="#d3ded8"/><rect x="914" y="78" width="254" height="28" rx="8" fill="#fcf0d5" stroke="none"/><text x="927" y="97" font-size="11" fill="#715014" font-weight="700">TELA ILUSTRATIVA • NÃO É CAPTURA</text><text x="271" y="229" font-size="23" fill="#233336" font-weight="700">Remover os recursos gerenciados pela Stack</text><rect x="272" y="253" width="862" height="180" rx="8" fill="#fff0e8" stroke="#d6a58b"/><text x="291" y="288" font-size="20" fill="#783e26" font-weight="400">Antes de confirmar, salve os dados que deseja manter.</text><text x="291" y="317" font-size="20" fill="#783e26" font-weight="400">A operação remove VM, disco e arquivos locais, rede e IAM</text><text x="291" y="346" font-size="20" fill="#783e26" font-weight="400">gerenciados por esta Stack.</text><text x="291" y="375" font-size="20" fill="#783e26" font-weight="400">O token do bot Telegram não é revogado por esta ação.</text><text x="275" y="480" font-size="20" fill="#233336" font-weight="400">1. Execute Destroy e aguarde Succeeded.</text><text x="275" y="509" font-size="20" fill="#233336" font-weight="400">2. Só depois exclua a Stack, se desejar.</text><text x="275" y="538" font-size="20" fill="#233336" font-weight="400">3. Gerencie ou revogue o bot separadamente no BotFather.</text><rect x="776" y="609" width="162" height="42" rx="5" fill="#fff" stroke="#bac7c6"/><text x="792" y="636" font-size="16" fill="#294e4b" font-weight="600">Cancelar</text><rect x="953" y="609" width="181" height="42" rx="8" fill="#a54630" stroke="none"/><text x="970" y="636" font-size="16" fill="#fff" font-weight="700">Confirmar Destroy</text><rect x="32" y="705" width="1136" height="57" rx="8" fill="#e4efeb" stroke="none"/><rect x="44" y="716" width="34" height="34" rx="8" fill="#215f55" stroke="none"/><text x="53" y="740" font-size="17" fill="#fff" font-weight="700">11</text><text x="94" y="730" font-size="16" fill="#233336" font-weight="400">Destroy apaga dados da VM. Confira backups antes de continuar.</text><text x="94" y="755" font-size="16" fill="#233336" font-weight="400">Excluir a Stack sem Destroy não garante remover os recursos. Cópias locais e histórico podem reter segredos.</text><text x="32" y="781" font-size="12" fill="#677871" font-weight="400">Hermes Agent na OCI • guia para eventos • campos e posições podem variar na Console</text></svg>
