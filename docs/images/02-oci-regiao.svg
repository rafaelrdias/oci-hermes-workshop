<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">Escolha a região da instalação</title><desc id="desc">Tela ilustrativa. Dados fictícios. Confira que a região está subscrita e READY. A seleção da Console e do formulário devem coincidir. Créditos, quotas e acesso ao modelo precisam estar disponíveis na sua conta.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="0" y="0" width="1200" height="790" rx="0" fill="#f8faf8" stroke="none"/><rect x="0" y="0" width="1200" height="60" rx="0" fill="#263331" stroke="none"/><text x="28" y="39" font-size="24" fill="#fff" font-weight="700">ORACLE</text><text x="175" y="38" font-size="18" fill="#fff" font-weight="400">Cloud Infrastructure</text><text x="778" y="37" font-size="16" fill="#d7e3dd" font-weight="400">⌕  Pesquisar recursos</text><rect x="26" y="88" width="181" height="594" rx="8" fill="#f1f4f2" stroke="none"/><text x="42" y="122" font-size="17" fill="#2c4942" font-weight="700">Resource Manager</text><text x="42" y="171" font-size="16" fill="#233336" font-weight="400">Visão geral</text><text x="42" y="249" font-size="16" fill="#233336" font-weight="400">Jobs</text><text x="42" y="286" font-size="16" fill="#233336" font-weight="400">Configurações</text><rect x="31" y="187" width="170" height="37" rx="8" fill="#dceae4" stroke="none"/><text x="43" y="212" font-size="16" fill="#245d4d" font-weight="700">Stacks</text><text x="245" y="99" font-size="15" fill="#61736c" font-weight="400">Console OCI  /  Resource Manager</text><text x="245" y="155" font-size="27" fill="#203d35" font-weight="700">Escolha a região da instalação</text><rect x="244" y="188" width="924" height="494" rx="8" fill="#fff" stroke="#d3ded8"/><rect x="914" y="78" width="254" height="28" rx="8" fill="#fcf0d5" stroke="none"/><text x="927" y="97" font-size="11" fill="#715014" font-weight="700">TELA ILUSTRATIVA • NÃO É CAPTURA</text><text x="271" y="226" font-size="18" fill="#233336" font-weight="700">Região selecionada</text><text x="271" y="261" font-size="16" fill="#475854" font-weight="600">Região da Console</text><rect x="271" y="273" width="590" height="43" rx="5" fill="#fff" stroke="#147c6c"/><text x="285" y="300" font-size="18" fill="#233336" font-weight="400">US Midwest (Chicago)  —  us-chicago-1</text><rect x="271" y="333" width="590" height="139" rx="8" fill="#fff" stroke="#abc6bd"/><rect x="279" y="343" width="574" height="48" rx="8" fill="#e2f0e7" stroke="none"/><text x="295" y="374" font-size="18" fill="#233336" font-weight="400">✓  US Midwest (Chicago)  —  us-chicago-1</text><text x="295" y="429" font-size="18" fill="#233336" font-weight="400">Brazil East (São Paulo)  —  sa-saopaulo-1</text><text x="890" y="303" font-size="13" fill="#326253" font-weight="700">REGIÃO DO LAB</text><text x="273" y="521" font-size="19" fill="#233336" font-weight="400">Chicago: GPT-OSS 120B (padrão).</text><text x="273" y="549" font-size="19" fill="#233336" font-weight="400">São Paulo: escolha Llama 3.3 70B explicitamente.</text><text x="273" y="577" font-size="19" fill="#233336" font-weight="400">A home region pode ser diferente; IAM usa o endpoint dela.</text><rect x="1000" y="611" width="140" height="42" rx="5" fill="#285d59" stroke="none"/><text x="1016" y="638" font-size="16" fill="#fff" font-weight="600">Confirmar</text><rect x="32" y="705" width="1136" height="57" rx="8" fill="#e4efeb" stroke="none"/><rect x="44" y="716" width="34" height="34" rx="8" fill="#215f55" stroke="none"/><text x="53" y="740" font-size="17" fill="#fff" font-weight="700">02</text><text x="94" y="730" font-size="16" fill="#233336" font-weight="400">Confira que a região está subscrita e READY. A seleção da Console e do formulário devem coincidir.</text><text x="94" y="755" font-size="16" fill="#233336" font-weight="400">Créditos, quotas e acesso ao modelo precisam estar disponíveis na sua conta.</text><text x="32" y="781" font-size="12" fill="#677871" font-weight="400">Hermes Agent na OCI • guia para eventos • campos e posições podem variar na Console</text></svg>
