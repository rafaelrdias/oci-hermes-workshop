<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">hermes-evento — revise antes de aplicar</title><desc id="desc">Tela ilustrativa. Dados fictícios. Review: deixe Run apply desmarcado. Execute Plan, revise os recursos/custos e então Apply. Não abra outra Stack para acelerar. Aguarde o job e depois acompanhe o vínculo no Telegram.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="0" y="0" width="1200" height="790" rx="0" fill="#f8faf8" stroke="none"/><rect x="0" y="0" width="1200" height="60" rx="0" fill="#263331" stroke="none"/><text x="28" y="39" font-size="24" fill="#fff" font-weight="700">ORACLE</text><text x="175" y="38" font-size="18" fill="#fff" font-weight="400">Cloud Infrastructure</text><text x="778" y="37" font-size="16" fill="#d7e3dd" font-weight="400">⌕  Pesquisar recursos</text><rect x="26" y="88" width="181" height="594" rx="8" fill="#f1f4f2" stroke="none"/><text x="42" y="122" font-size="17" fill="#2c4942" font-weight="700">Resource Manager</text><text x="42" y="171" font-size="16" fill="#233336" font-weight="400">Visão geral</text><text x="42" y="249" font-size="16" fill="#233336" font-weight="400">Jobs</text><text x="42" y="286" font-size="16" fill="#233336" font-weight="400">Configurações</text><rect x="31" y="187" width="170" height="37" rx="8" fill="#dceae4" stroke="none"/><text x="43" y="212" font-size="16" fill="#245d4d" font-weight="700">Stacks</text><text x="245" y="99" font-size="15" fill="#61736c" font-weight="400">Console OCI  /  Resource Manager</text><text x="245" y="155" font-size="27" fill="#203d35" font-weight="700">hermes-evento — revise antes de aplicar</text><rect x="244" y="188" width="924" height="494" rx="8" fill="#fff" stroke="#d3ded8"/><rect x="914" y="78" width="254" height="28" rx="8" fill="#fcf0d5" stroke="none"/><text x="927" y="97" font-size="11" fill="#715014" font-weight="700">TELA ILUSTRATIVA • NÃO É CAPTURA</text><rect x="271" y="212" width="126" height="42" rx="5" fill="#285d59" stroke="none"/><text x="287" y="239" font-size="16" fill="#fff" font-weight="600">Plan</text><rect x="412" y="212" width="126" height="42" rx="5" fill="#285d59" stroke="none"/><text x="428" y="239" font-size="16" fill="#fff" font-weight="600">Apply</text><rect x="553" y="212" width="205" height="42" rx="5" fill="#fff" stroke="#bac7c6"/><text x="569" y="239" font-size="16" fill="#294e4b" font-weight="600">Terraform actions</text><text x="272" y="302" font-size="23" fill="#233336" font-weight="700">Jobs</text><rect x="271" y="325" width="864" height="40" rx="8" fill="#edf2ef" stroke="none"/><text x="286" y="352" font-size="16" fill="#41594d" font-weight="700">Name / Operation</text><text x="875" y="352" font-size="16" fill="#41594d" font-weight="700">State</text><text x="288" y="397" font-size="18" fill="#233336" font-weight="400">plan-…  /  Plan</text><rect x="875" y="374" width="112" height="28" rx="8" fill="#e0f0de" stroke="none"/><text x="887" y="393" font-size="14" fill="#365c38" font-weight="600">Succeeded</text><text x="288" y="449" font-size="18" fill="#233336" font-weight="400">apply-…  /  Apply</text><rect x="875" y="426" width="112" height="28" rx="8" fill="#e0f0de" stroke="none"/><text x="887" y="445" font-size="14" fill="#365c38" font-weight="600">Succeeded</text><rect x="271" y="489" width="864" height="110" rx="8" fill="#fdf3d9" stroke="none"/><text x="289" y="520" font-size="19" fill="#624917" font-weight="400">Apply concluído = recursos criados.</text><text x="289" y="548" font-size="19" fill="#624917" font-weight="400">O bootstrap da VM e os testes do Hermes ainda podem continuar.</text><text x="289" y="576" font-size="19" fill="#624917" font-weight="400">Próximo: abra Application information na própria Stack.</text><rect x="32" y="705" width="1136" height="57" rx="8" fill="#e4efeb" stroke="none"/><rect x="44" y="716" width="34" height="34" rx="8" fill="#215f55" stroke="none"/><text x="53" y="740" font-size="17" fill="#fff" font-weight="700">06</text><text x="94" y="730" font-size="16" fill="#233336" font-weight="400">Review: deixe Run apply desmarcado. Execute Plan, revise os recursos/custos e então Apply.</text><text x="94" y="755" font-size="16" fill="#233336" font-weight="400">Não abra outra Stack para acelerar. Aguarde o job e depois acompanhe o vínculo no Telegram.</text><text x="32" y="781" font-size="12" fill="#677871" font-weight="400">Hermes Agent na OCI • guia para eventos • campos e posições podem variar na Console</text></svg>
