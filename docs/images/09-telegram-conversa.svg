<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">Teste ferramentas e áudio → texto</title><desc id="desc">Tela ilustrativa. Dados fictícios. Exemplo de conversa: confira a execução real do arquivo, não apenas uma promessa do agente. Envie áudio curto. Whisper transcreve na VM; o Hermes responde sempre por texto.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="0" y="0" width="1200" height="790" rx="0" fill="#f8faf8" stroke="none"/><rect x="0" y="0" width="1200" height="60" rx="0" fill="#215d72" stroke="none"/><text x="28" y="39" font-size="24" fill="#fff" font-weight="700">Telegram</text><text x="884" y="37" font-size="16" fill="#e7f5fa" font-weight="400">Conversa privada • exemplo</text><rect x="26" y="90" width="245" height="592" rx="8" fill="#fff" stroke="#d1dee0"/><text x="45" y="124" font-size="20" fill="#244754" font-weight="700">Conversas</text><rect x="36" y="148" width="224" height="74" rx="8" fill="#e1f0f4" stroke="none"/><text x="48" y="178" font-size="19" fill="#244754" font-weight="700">Meu Hermes OCI</text><text x="48" y="203" font-size="14" fill="#526c74" font-weight="400">bot • dados fictícios</text><rect x="292" y="188" width="876" height="494" rx="8" fill="#e5eeeb" stroke="#d1ded6"/><text x="293" y="150" font-size="26" fill="#203d35" font-weight="700">Teste ferramentas e áudio → texto</text><rect x="914" y="78" width="254" height="28" rx="8" fill="#fcf0d5" stroke="none"/><text x="927" y="97" font-size="11" fill="#715014" font-weight="700">TELA ILUSTRATIVA • NÃO É CAPTURA</text><rect x="979" y="204" width="166" height="52" rx="10" fill="#d1eac3" stroke="none"/><text x="996" y="233" font-size="18" fill="#233336" font-weight="400">/new</text><rect x="314" y="275" width="565" height="52" rx="10" fill="#fff" stroke="none"/><text x="331" y="304" font-size="18" fill="#233336" font-weight="400">Nova sessão • modelo: hermes-oci (alias local)</text><rect x="484" y="345" width="661" height="52" rx="10" fill="#d1eac3" stroke="none"/><text x="501" y="374" font-size="18" fill="#233336" font-weight="400">Crie boas-vindas.txt com uma saudação e leia o arquivo.</text><rect x="314" y="418" width="721" height="79" rx="10" fill="#fff" stroke="none"/><text x="331" y="447" font-size="18" fill="#233336" font-weight="400">Arquivo criado e lido:</text><text x="331" y="474" font-size="18" fill="#233336" font-weight="400">“Boas-vindas! Vamos explorar IA com Hermes e OCI.”</text><rect x="764" y="522" width="380" height="52" rx="10" fill="#d1eac3" stroke="none"/><text x="781" y="551" font-size="18" fill="#233336" font-weight="400">▶  Áudio em português • 0:08</text><rect x="314" y="594" width="717" height="52" rx="10" fill="#fff" stroke="none"/><text x="331" y="623" font-size="18" fill="#233336" font-weight="400">Aqui estão três ideias para aplicar IA no seu trabalho…</text><rect x="32" y="705" width="1136" height="57" rx="8" fill="#e4efeb" stroke="none"/><rect x="44" y="716" width="34" height="34" rx="8" fill="#215f55" stroke="none"/><text x="53" y="740" font-size="17" fill="#fff" font-weight="700">09</text><text x="94" y="730" font-size="16" fill="#233336" font-weight="400">Exemplo de conversa: confira a execução real do arquivo, não apenas uma promessa do agente.</text><text x="94" y="755" font-size="16" fill="#233336" font-weight="400">Envie áudio curto. Whisper transcreve na VM; o Hermes responde sempre por texto.</text><text x="32" y="781" font-size="12" fill="#677871" font-weight="400">Hermes Agent na OCI • guia para eventos • campos e posições podem variar na Console</text></svg>
