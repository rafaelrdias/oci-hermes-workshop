<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">Create Stack — selecione a pasta</title><desc id="desc">Tela ilustrativa. Dados fictícios. Baixe o pacote Terraform pelo link do guia e extraia uma vez. Escolha My configuration → Folder. O botão Deploy to Oracle Cloud preenche o pacote diretamente. Deixe a Stack no compartment raiz.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="0" y="0" width="1200" height="790" rx="0" fill="#f8faf8" stroke="none"/><rect x="0" y="0" width="1200" height="60" rx="0" fill="#263331" stroke="none"/><text x="28" y="39" font-size="24" fill="#fff" font-weight="700">ORACLE</text><text x="175" y="38" font-size="18" fill="#fff" font-weight="400">Cloud Infrastructure</text><text x="778" y="37" font-size="16" fill="#d7e3dd" font-weight="400">⌕  Pesquisar recursos</text><rect x="26" y="88" width="181" height="594" rx="8" fill="#f1f4f2" stroke="none"/><text x="42" y="122" font-size="17" fill="#2c4942" font-weight="700">Resource Manager</text><text x="42" y="171" font-size="16" fill="#233336" font-weight="400">Visão geral</text><text x="42" y="249" font-size="16" fill="#233336" font-weight="400">Jobs</text><text x="42" y="286" font-size="16" fill="#233336" font-weight="400">Configurações</text><rect x="31" y="187" width="170" height="37" rx="8" fill="#dceae4" stroke="none"/><text x="43" y="212" font-size="16" fill="#245d4d" font-weight="700">Stacks</text><text x="245" y="99" font-size="15" fill="#61736c" font-weight="400">Console OCI  /  Resource Manager</text><text x="245" y="155" font-size="27" fill="#203d35" font-weight="700">Create Stack — selecione a pasta</text><rect x="244" y="188" width="924" height="494" rx="8" fill="#fff" stroke="#d3ded8"/><rect x="914" y="78" width="254" height="28" rx="8" fill="#fcf0d5" stroke="none"/><text x="927" y="97" font-size="11" fill="#715014" font-weight="700">TELA ILUSTRATIVA • NÃO É CAPTURA</text><text x="271" y="226" font-size="21" fill="#233336" font-weight="700">My configuration</text><rect x="271" y="245" width="133" height="42" rx="5" fill="#285d59" stroke="none"/><text x="287" y="272" font-size="16" fill="#fff" font-weight="600">Folder</text><rect x="418" y="245" width="141" height="42" rx="5" fill="#fff" stroke="#bac7c6"/><text x="434" y="272" font-size="16" fill="#294e4b" font-weight="600">Zip file</text><rect x="572" y="245" width="190" height="42" rx="5" fill="#fff" stroke="#bac7c6"/><text x="588" y="272" font-size="16" fill="#294e4b" font-weight="600">Git repository</text><rect x="271" y="307" width="863" height="115" rx="8" fill="#f4f9f5" stroke="#7aaa94"/><text x="292" y="340" font-size="20" fill="#245e48" font-weight="700">Pasta: oci-hermes-workshop-resource-manager</text><text x="292" y="375" font-size="17" fill="#233336" font-weight="400">main.tf   •   variables.tf   •   schema.yaml   •   files/</text><text x="292" y="401" font-size="17" fill="#233336" font-weight="400">Selecione a pasta extraída, não o repositório inteiro.</text><text x="271" y="459" font-size="16" fill="#475854" font-weight="600">Stack name</text><rect x="271" y="471" width="420" height="43" rx="5" fill="#fff" stroke="#bcc9c6"/><text x="285" y="498" font-size="18" fill="#233336" font-weight="400">hermes-evento</text><text x="720" y="459" font-size="16" fill="#475854" font-weight="600">Create in compartment</text><rect x="720" y="471" width="414" height="43" rx="5" fill="#fff" stroke="#147c6c"/><text x="734" y="498" font-size="18" fill="#233336" font-weight="400">SUA_TENANCY (root)</text><text x="271" y="557" font-size="17" fill="#233336" font-weight="400">Terraform version: &gt;= 1.5 e &lt; 2.0, entre as disponíveis</text><rect x="1000" y="611" width="134" height="42" rx="5" fill="#285d59" stroke="none"/><text x="1016" y="638" font-size="16" fill="#fff" font-weight="600">Next</text><rect x="32" y="705" width="1136" height="57" rx="8" fill="#e4efeb" stroke="none"/><rect x="44" y="716" width="34" height="34" rx="8" fill="#215f55" stroke="none"/><text x="53" y="740" font-size="17" fill="#fff" font-weight="700">03</text><text x="94" y="730" font-size="16" fill="#233336" font-weight="400">Baixe o pacote Terraform pelo link do guia e extraia uma vez. Escolha My configuration → Folder.</text><text x="94" y="755" font-size="16" fill="#233336" font-weight="400">O botão Deploy to Oracle Cloud preenche o pacote diretamente. Deixe a Stack no compartment raiz.</text><text x="32" y="781" font-size="12" fill="#677871" font-weight="400">Hermes Agent na OCI • guia para eventos • campos e posições podem variar na Console</text></svg>
