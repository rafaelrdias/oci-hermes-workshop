<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">Seu bot — vincule sua conta em DM</title><desc id="desc">Tela ilustrativa. Dados fictícios. Abra seu bot, não o @BotFather. Envie o comando completo em conversa privada. Aguarde Conta vinculada! e Configuração concluída! antes de testar o agente.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="0" y="0" width="1200" height="790" rx="0" fill="#f8faf8" stroke="none"/><rect x="0" y="0" width="1200" height="60" rx="0" fill="#215d72" stroke="none"/><text x="28" y="39" font-size="24" fill="#fff" font-weight="700">Telegram</text><text x="884" y="37" font-size="16" fill="#e7f5fa" font-weight="400">Conversa privada • exemplo</text><rect x="26" y="90" width="245" height="592" rx="8" fill="#fff" stroke="#d1dee0"/><text x="45" y="124" font-size="20" fill="#244754" font-weight="700">Conversas</text><rect x="36" y="148" width="224" height="74" rx="8" fill="#e1f0f4" stroke="none"/><text x="48" y="178" font-size="19" fill="#244754" font-weight="700">Meu Hermes OCI</text><text x="48" y="203" font-size="14" fill="#526c74" font-weight="400">bot • dados fictícios</text><rect x="292" y="188" width="876" height="494" rx="8" fill="#e5eeeb" stroke="#d1ded6"/><text x="293" y="150" font-size="26" fill="#203d35" font-weight="700">Seu bot — vincule sua conta em DM</text><rect x="914" y="78" width="254" height="28" rx="8" fill="#fcf0d5" stroke="none"/><text x="927" y="97" font-size="11" fill="#715014" font-weight="700">TELA ILUSTRATIVA • NÃO É CAPTURA</text><rect x="557" y="209" width="585" height="52" rx="10" fill="#d1eac3" stroke="none"/><text x="574" y="238" font-size="18" fill="#233336" font-weight="400">/start stand_CODIGO_DA_SUA_STACK</text><rect x="314" y="278" width="761" height="79" rx="10" fill="#fff" stroke="none"/><text x="331" y="307" font-size="18" fill="#233336" font-weight="400">Conta vinculada! Estou validando acesso OCI e</text><text x="331" y="334" font-size="18" fill="#233336" font-weight="400">ferramentas. Avisarei quando o Hermes estiver pronto.</text><rect x="314" y="395" width="809" height="133" rx="10" fill="#fff" stroke="none"/><text x="331" y="424" font-size="18" fill="#233336" font-weight="400">Configuração concluída! Envie /new e depois:</text><text x="331" y="451" font-size="18" fill="#233336" font-weight="400">Crie boas-vindas.txt no seu workspace com uma saudação</text><text x="331" y="478" font-size="18" fill="#233336" font-weight="400">e leia o arquivo. Sua próxima mensagem fará o teste final</text><text x="331" y="505" font-size="18" fill="#233336" font-weight="400">do Hermes pelo Telegram.</text><text x="318" y="581" font-size="17" fill="#536c5a" font-weight="400">Use o código real da sua Stack, não o texto desta imagem.</text><text x="318" y="620" font-size="18" fill="#245d4d" font-weight="700">/start sozinho não conclui o vínculo deste laboratório.</text><rect x="32" y="705" width="1136" height="57" rx="8" fill="#e4efeb" stroke="none"/><rect x="44" y="716" width="34" height="34" rx="8" fill="#215f55" stroke="none"/><text x="53" y="740" font-size="17" fill="#fff" font-weight="700">08</text><text x="94" y="730" font-size="16" fill="#233336" font-weight="400">Abra seu bot, não o @BotFather. Envie o comando completo em conversa privada.</text><text x="94" y="755" font-size="16" fill="#233336" font-weight="400">Aguarde Conta vinculada! e Configuração concluída! antes de testar o agente.</text><text x="32" y="781" font-size="12" fill="#677871" font-weight="400">Hermes Agent na OCI • guia para eventos • campos e posições podem variar na Console</text></svg>
