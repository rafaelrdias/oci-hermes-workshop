<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">Crie um bot e guarde token + username</title><desc id="desc">Tela ilustrativa. Dados fictícios. Abra o @BotFather oficial e envie /newbot. Escolha um username único terminado em bot. Guarde o link do seu bot. Não envie token para o facilitador, ao bot ou ao GitHub.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="0" y="0" width="1200" height="790" rx="0" fill="#f8faf8" stroke="none"/><rect x="0" y="0" width="1200" height="60" rx="0" fill="#215d72" stroke="none"/><text x="28" y="39" font-size="24" fill="#fff" font-weight="700">Telegram</text><text x="884" y="37" font-size="16" fill="#e7f5fa" font-weight="400">Conversa privada • exemplo</text><rect x="26" y="90" width="245" height="592" rx="8" fill="#fff" stroke="#d1dee0"/><text x="45" y="124" font-size="20" fill="#244754" font-weight="700">Conversas</text><rect x="36" y="148" width="224" height="74" rx="8" fill="#e1f0f4" stroke="none"/><text x="48" y="178" font-size="19" fill="#244754" font-weight="700">BotFather</text><text x="48" y="203" font-size="14" fill="#526c74" font-weight="400">bot • dados fictícios</text><rect x="292" y="188" width="876" height="494" rx="8" fill="#e5eeeb" stroke="#d1ded6"/><text x="293" y="150" font-size="26" fill="#203d35" font-weight="700">Crie um bot e guarde token + username</text><rect x="914" y="78" width="254" height="28" rx="8" fill="#fcf0d5" stroke="none"/><text x="927" y="97" font-size="11" fill="#715014" font-weight="700">TELA ILUSTRATIVA • NÃO É CAPTURA</text><rect x="778" y="202" width="366" height="52" rx="10" fill="#d1eac3" stroke="none"/><text x="795" y="231" font-size="18" fill="#233336" font-weight="400">/newbot</text><rect x="314" y="267" width="680" height="52" rx="10" fill="#fff" stroke="none"/><text x="331" y="296" font-size="18" fill="#233336" font-weight="400">BotFather: escolha um nome para o bot.</text><rect x="674" y="332" width="470" height="52" rx="10" fill="#d1eac3" stroke="none"/><text x="691" y="361" font-size="18" fill="#233336" font-weight="400">Meu Hermes OCI</text><rect x="314" y="397" width="760" height="52" rx="10" fill="#fff" stroke="none"/><text x="331" y="426" font-size="18" fill="#233336" font-weight="400">BotFather: escolha um username único terminado em bot.</text><rect x="674" y="462" width="470" height="52" rx="10" fill="#d1eac3" stroke="none"/><text x="691" y="491" font-size="18" fill="#233336" font-weight="400">hermes_seu_nome_bot</text><rect x="314" y="527" width="795" height="106" rx="10" fill="#fff" stroke="none"/><text x="331" y="556" font-size="18" fill="#233336" font-weight="400">Bot criado: t.me/hermes_seu_nome_bot</text><text x="331" y="583" font-size="18" fill="#233336" font-weight="400">Token: TOKEN_OCULTO_EXEMPLO</text><text x="331" y="610" font-size="18" fill="#233336" font-weight="400">Use o token somente no campo sensível da Stack.</text><rect x="32" y="705" width="1136" height="57" rx="8" fill="#e4efeb" stroke="none"/><rect x="44" y="716" width="34" height="34" rx="8" fill="#215f55" stroke="none"/><text x="53" y="740" font-size="17" fill="#fff" font-weight="700">01</text><text x="94" y="730" font-size="16" fill="#233336" font-weight="400">Abra o @BotFather oficial e envie /newbot. Escolha um username único terminado em bot.</text><text x="94" y="755" font-size="16" fill="#233336" font-weight="400">Guarde o link do seu bot. Não envie token para o facilitador, ao bot ou ao GitHub.</text><text x="32" y="781" font-size="12" fill="#677871" font-weight="400">Hermes Agent na OCI • guia para eventos • campos e posições podem variar na Console</text></svg>
