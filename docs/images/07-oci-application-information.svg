<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">hermes-evento — a Stack que você executou</title><desc id="desc">Tela ilustrativa. Dados fictícios. Resource Manager → Stacks → a Stack que acabou de executar → Application information. Não compartilhe nem projete o código. O primeiro usuário válido em DM será o dono do agente.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="0" y="0" width="1200" height="790" rx="0" fill="#f8faf8" stroke="none"/><rect x="0" y="0" width="1200" height="60" rx="0" fill="#263331" stroke="none"/><text x="28" y="39" font-size="24" fill="#fff" font-weight="700">ORACLE</text><text x="175" y="38" font-size="18" fill="#fff" font-weight="400">Cloud Infrastructure</text><text x="778" y="37" font-size="16" fill="#d7e3dd" font-weight="400">⌕  Pesquisar recursos</text><rect x="26" y="88" width="181" height="594" rx="8" fill="#f1f4f2" stroke="none"/><text x="42" y="122" font-size="17" fill="#2c4942" font-weight="700">Resource Manager</text><text x="42" y="171" font-size="16" fill="#233336" font-weight="400">Visão geral</text><text x="42" y="249" font-size="16" fill="#233336" font-weight="400">Jobs</text><text x="42" y="286" font-size="16" fill="#233336" font-weight="400">Configurações</text><rect x="31" y="187" width="170" height="37" rx="8" fill="#dceae4" stroke="none"/><text x="43" y="212" font-size="16" fill="#245d4d" font-weight="700">Stacks</text><text x="245" y="99" font-size="15" fill="#61736c" font-weight="400">Console OCI  /  Resource Manager</text><text x="245" y="155" font-size="27" fill="#203d35" font-weight="700">hermes-evento — a Stack que você executou</text><rect x="244" y="188" width="924" height="494" rx="8" fill="#fff" stroke="#d3ded8"/><rect x="914" y="78" width="254" height="28" rx="8" fill="#fcf0d5" stroke="none"/><text x="927" y="97" font-size="11" fill="#715014" font-weight="700">TELA ILUSTRATIVA • NÃO É CAPTURA</text><text x="271" y="227" font-size="16" fill="#233336" font-weight="400">Stack details</text><rect x="429" y="199" width="254" height="47" rx="8" fill="#e0efe6" stroke="none"/><text x="445" y="227" font-size="18" fill="#20614d" font-weight="700">Application information</text><text x="726" y="227" font-size="16" fill="#233336" font-weight="400">Jobs</text><text x="272" y="290" font-size="23" fill="#233336" font-weight="700">Próximo passo no Telegram</text><text x="271" y="336" font-size="16" fill="#475854" font-weight="600">telegram_pairing_command</text><rect x="271" y="348" width="863" height="43" rx="5" fill="#fff" stroke="#147c6c"/><text x="285" y="375" font-size="18" fill="#233336" font-weight="400">••••••••••••••••••••••••••••••••••••••••••</text><rect x="832" y="414" width="144" height="42" rx="5" fill="#fff" stroke="#bac7c6"/><text x="848" y="441" font-size="16" fill="#294e4b" font-weight="600">Revelar</text><rect x="991" y="414" width="143" height="42" rx="5" fill="#285d59" stroke="none"/><text x="1007" y="441" font-size="16" fill="#fff" font-weight="600">Copiar</text><text x="272" y="503" font-size="19" fill="#233336" font-weight="400">1. Revele e copie o comando inteiro, incluindo /start e o código.</text><text x="272" y="531" font-size="19" fill="#233336" font-weight="400">2. Abra SEU bot pelo link recebido do BotFather.</text><text x="272" y="559" font-size="19" fill="#233336" font-weight="400">3. Cole o comando em uma conversa privada.</text><text x="272" y="619" font-size="19" fill="#245d4d" font-weight="700">Este valor fica na Stack — não na VM nem no BotFather.</text><rect x="32" y="705" width="1136" height="57" rx="8" fill="#e4efeb" stroke="none"/><rect x="44" y="716" width="34" height="34" rx="8" fill="#215f55" stroke="none"/><text x="53" y="740" font-size="17" fill="#fff" font-weight="700">07</text><text x="94" y="730" font-size="16" fill="#233336" font-weight="400">Resource Manager → Stacks → a Stack que acabou de executar → Application information.</text><text x="94" y="755" font-size="16" fill="#233336" font-weight="400">Não compartilhe nem projete o código. O primeiro usuário válido em DM será o dono do agente.</text><text x="32" y="781" font-size="12" fill="#677871" font-weight="400">Hermes Agent na OCI • guia para eventos • campos e posições podem variar na Console</text></svg>
