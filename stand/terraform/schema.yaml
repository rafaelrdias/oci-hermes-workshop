schemaVersion: 1.1.0
version: '1.4.0'
locale: en
title: 'Hermes no Telegram — stand Oracle'
description: 'Trial ORD ou GRU. Instalação e configuração automáticas, sem Cloud Shell ou SSH obrigatório.'
informationalText: 'Apply cria a VM; depois copie o comando privado de pareamento abaixo e envie ao bot. Aguarde a mensagem de pronto no Telegram. Não compartilhe token, comando, state ou metadados.'
variableGroups:
  - title: '1. Região da instalação'
    variables: [region, llm_model, stt_enabled, prefix]
  - title: '2. Bot pessoal e segurança'
    variables: [telegram_bot_token, acknowledge_secret_in_state]
  - title: '3. Compute — consome créditos do Trial'
    variables: [instance_shape, availability_domain_index]
  - title: '4. Opcional — acesso SSH e chave automática'
    variables: [generate_ssh_key, acknowledge_ssh_private_key_in_state, ssh_public_key, ssh_allowed_cidr, acknowledge_public_ssh]
  - title: 'Valores preenchidos pela Console'
    visible: false
    variables: [tenancy_ocid, image_ocid]
variables:
  tenancy_ocid:
    type: string
    visible: false
  region:
    type: enum
    title: 'Região da instalação'
    description: 'Chicago ou São Paulo, subscrita e selecionada na Console. Não precisa ser a home region; IAM usa a home region automaticamente.'
    enum: [us-chicago-1, sa-saopaulo-1]
    required: true
  prefix:
    type: string
    title: 'Nome do ambiente'
    default: hermes-stand
    required: true
  llm_model:
    type: enum
    title: 'LLM: Grok 4.3 em Chicago (padrão); Llama para GRU'
    enum: [xai.grok-4.3, xai.grok-4.6, meta.llama-3.3-70b-instruct]
    default: xai.grok-4.3
    description: 'Modelo usado pelo Hermes. IAM permite todos os modelos de chat em Chicago; em GRU, somente Llama. Grok é cobrado via OCI e hospedado pela xAI. Sem fallback automático.'
    required: true
  stt_enabled:
    type: boolean
    title: 'Transcrever áudios localmente (sem API paga de STT)'
    description: 'Whisper base na CPU, português. Download inicial ~150 MB na VM. Respostas sempre em texto; LLM e VM consomem créditos.'
    default: true
  telegram_bot_token:
    type: password
    title: 'Token do BotFather (bot novo e exclusivo)'
    description: 'Mascarado na tela, mas salvo no state/variáveis da Stack e no user-data da VM. Restrinja o acesso a esses recursos.'
    required: true
    confirmation: true
  acknowledge_secret_in_state:
    type: boolean
    title: 'Entendo e aceito a persistência do token no state e nos metadados'
    description: 'Demonstração pessoal. Não publicar state, variáveis, prints ou token. Sensitive mascara a saída; não elimina o segredo do state.'
    default: false
    required: true
  instance_shape:
    type: enum
    title: 'Shape (1 OCPU / 8 GB RAM / 50 GB de boot)'
    enum: [VM.Standard.E5.Flex, VM.Standard.E4.Flex, VM.Standard.A1.Flex]
    default: VM.Standard.E5.Flex
    description: 'E5/E4 usam créditos. A1 depende de quota/capacidade e elegibilidade gratuita da conta.'
    required: true
  availability_domain_index:
    type: integer
    title: 'Availability domain: 0 = primeiro'
    default: 0
    minimum: 0
    description: 'Mantenha 0. Outro valor só se o AD existir na sua tenancy/região.'
  generate_ssh_key:
    type: boolean
    title: 'Gerar chave SSH automaticamente para esta Stack'
    description: 'RSA 4096. Instala somente a pública na VM. Após Apply, copie a privada em Application information. Não abre a porta SSH sozinho.'
    default: false
  acknowledge_ssh_private_key_in_state:
    type: boolean
    title: 'Aceito armazenar a chave SSH privada no state da Stack'
    description: 'Obrigatório para gerar. Sensitive mascara a tela, mas quem acessa o state pode obter a chave. Guarde cópia segura; não compartilhe state, chave ou prints. Uso de laboratório, não produção.'
    default: false
  ssh_public_key:
    type: string
    title: 'Chave pública SSH opcional'
    description: 'Somente se NÃO gerar automaticamente. Cole a pública ssh-rsa ou ssh-ed25519; nunca uma chave privada. Pode instalar a chave com a porta fechada.'
    required: false
    default: ''
  ssh_allowed_cidr:
    type: string
    title: 'Origem IPv4 do SSH: /32 ou 0.0.0.0/0, opcional'
    description: 'Exige chave gerada ou fornecida. /32 restringe a um IP; 0.0.0.0/0 exige aceite abaixo. Vazio mantém SSH fechado, mesmo com chave gerada; pode liberar depois.'
    required: false
    default: ''
  acknowledge_public_ssh:
    type: boolean
    title: 'Aceito expor a porta SSH à internet temporariamente'
    description: 'Obrigatório somente para 0.0.0.0/0. Qualquer IPv4 poderá tentar conectar; proteja a chave privada e restrinja ou feche SSH após o evento. Não há fechamento automático.'
    default: false
  image_ocid:
    type: string
    visible: false
    default: ''
outputGroups:
  - title: 'Próximo passo no Telegram'
    outputs: [telegram_pairing_command, next_step]
  - title: 'Ambiente criado'
    outputs: [region, iam_home_region, model, public_ip, instance_id, compartment_id]
  - title: 'SSH opcional — guarde sua chave privada em segurança'
    outputs: [ssh_private_key_pem, ssh_public_key, ssh_connection_command]
outputs:
  ssh_private_key_pem:
    type: copyableString
    title: 'Chave PRIVADA gerada: revelar, copiar e salvar como hermes.key (vazio se não gerada)'
    sensitive: true
  ssh_public_key:
    type: copyableString
    title: 'Chave pública da VM'
  ssh_connection_command:
    type: copyableString
    title: 'Comando SSH para usar no computador com sua chave'
  telegram_pairing_command:
    type: copyableString
    title: 'Desbloqueie, copie e envie este comando em DM ao seu bot'
    sensitive: true
  next_step:
    type: string
    title: 'Como concluir'
  region:
    type: string
    title: 'Região'
  iam_home_region:
    type: string
    title: 'Home region detectada (somente endpoint IAM global)'
  model:
    type: string
    title: 'Modelo OCI on-demand'
  public_ip:
    type: copyableString
    title: 'IPv4 da VM (sem serviço web público)'
  instance_id:
    type: copyableString
    title: 'OCID da VM'
  compartment_id:
    type: copyableString
    title: 'Compartment criado automaticamente'
